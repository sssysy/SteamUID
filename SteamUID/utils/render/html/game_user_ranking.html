<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
        <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/game_user_ranking.css">
</head>
<body>
<div class="ranking-container">
    <div class="ranking-header">
        <div class="ranking-header-top">
            <div class="ranking-title">{{title_text}}</div>
            <div class="game-badge">
                <img class="game-logo" src="{{game_logo_url}}" onerror="this.onerror=null;this.src='{{default_cover}}'" alt="">
                <div class="game-name" title="{{game_name}}">{{game_name}}</div>
            </div>
        </div>
        <div class="ranking-header-cols">
            <div class="header-col-rank">排名</div>
            <div class="header-col-duration">群累计时长</div>
        </div>
    </div>
    <div class="ranking-list">
        {{items_html}}
    </div>
    <div class="card-footer">
        Create by <span class="footer-highlight">GsCore</span> &amp; Power by <span class="footer-highlight">SteamUID</span> &amp; Author by <span class="footer-highlight">sssysy</span>
    </div>
</div>
</body>
</html>
