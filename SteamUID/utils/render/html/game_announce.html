<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
        <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/game_announce.css">
</head>
<body>
<div class="announce-container">
    <div class="announce-header">
        <div class="announce-header-top">
            <div class="announce-title-col">
                <div class="announce-tag">{{event_tag}}</div>
                <div class="announce-title">{{announce_title}}</div>
            </div>
            <div class="game-badge">
                <img class="game-logo" src="{{game_logo_url}}" onerror="this.onerror=null;this.src='{{default_cover}}'" alt="">
                <div class="game-name" title="{{game_name}}">{{game_name}}</div>
            </div>
        </div>
    </div>
    <div class="announce-content">
        {{content_html}}
    </div>
    <div class="card-footer">
        Create by <span class="footer-highlight">GsCore</span> &amp; Power by <span class="footer-highlight">SteamUID</span> &amp; Author by <span class="footer-highlight">sssysy</span>
    </div>
</div>
</body>
</html>
