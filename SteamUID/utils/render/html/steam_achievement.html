<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
        <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/steam_achievement.css">
</head>
<body>
    <div class="steam-achievement-card">
        <!-- 顶部信息栏 -->
        <div class="achievement-header">
            <div class="header-bg" style="background-image: url('{{cover_url}}');"></div>
            <div class="header-overlay"></div>
            <div class="header-content">
                <div class="header-top-row">
                    <div class="game-info">
                        <img class="game-icon" src="{{game_icon_url}}" onerror="this.onerror=null;this.src='{{default_icon}}'" alt="">
                        <div class="game-title" title="{{game_name}}">{{game_name}}</div>
                    </div>
                    {{account_pill_html}}
                </div>

                <!-- 进度条 -->
                <div class="progress-section">
                    <div class="progress-meta">
                        <span class="progress-left">已获得 {{unlocked_count}} 项成就，共 {{total_count}} 项</span>
                        <span class="progress-right">({{percentage}}%)</span>
                    </div>
                    <div class="progress-bar-container">
                        <div class="progress-bar-fill" style="width: {{percentage}}%;"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 成就多列主体内容 -->
        <div class="achievements-body">
            {{columns_html}}
        </div>

        <!-- Footer -->
        <div class="card-footer">
            Create by <span class="footer-highlight">GsCore</span> &amp; Power by <span class="footer-highlight">SteamUID</span> &amp; Author by <span class="footer-highlight">sssysy</span>
        </div>
    </div>
</body>
</html>
