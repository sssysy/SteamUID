<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <style>
        @font-face {
            font-family: 'Motiva Sans';
            font-style: normal;
            font-weight: 400;
            src: url('https://community.cloudflare.steamstatic.com/public/shared/fonts/motiva-sans-regular.woff') format('woff');
        }
        @font-face {
            font-family: 'Motiva Sans';
            font-style: normal;
            font-weight: 500;
            src: url('https://community.cloudflare.steamstatic.com/public/shared/fonts/motiva-sans-medium.woff') format('woff');
        }
        @font-face {
            font-family: 'Motiva Sans';
            font-style: normal;
            font-weight: 700;
            src: url('https://community.cloudflare.steamstatic.com/public/shared/fonts/motiva-sans-bold.woff') format('woff');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        body {
            background: transparent;
            display: inline-block;
        }

        .ranking-container {
            width: {{canvas_width}}px;
            background: #171d25;
            padding: 24px 28px;
            font-family: "Motiva Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", "Noto Sans CJK SC", "Noto Sans SC", sans-serif;
            color: #ffffff;
        }

        /* 顶部表头 */
        .ranking-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 16px;
            margin-bottom: 8px;
        }

        .ranking-title {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.2px;
        }

        .header-cols {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-col-rank {
            width: 70px;
            text-align: right;
            font-size: 14px;
            font-weight: 700;
            color: #8f98a0;
        }

        .header-col-duration {
            width: 100px;
            text-align: right;
            font-size: 14px;
            font-weight: 700;
            color: #8f98a0;
        }

        /* 列表区域 */
        .ranking-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .ranking-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 0;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.02);
            transition: background 0.2s;
        }

        .ranking-item:nth-child(even) {
            background: rgba(255, 255, 255, 0.04);
        }

        .user-info-col {
            display: flex;
            align-items: center;
            flex: 1;
            min-width: 0;
            padding-right: 16px;
        }

        .user-avatar-wrapper {
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            border-radius: 4px;
            overflow: hidden;
            background: #11141a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .user-avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .user-name {
            margin-left: 16px;
            font-size: 16px;
            font-weight: 500;
            color: #f3f3f3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3;
        }

        .data-cols {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-shrink: 0;
        }

        .rank-num {
            width: 70px;
            text-align: right;
            font-size: 16px;
            font-weight: 700;
            color: #5cbe32;
            letter-spacing: 0.2px;
        }

        .duration-text {
            width: 100px;
            text-align: right;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 0.2px;
        }

        .card-footer {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            width: 100%;
            margin-top: 16px;
            box-sizing: border-box;
            font-size: 11px;
            color: #8f98a0;
            font-weight: 400;
            letter-spacing: 0.3px;
            user-select: none;
        }

        .card-footer .footer-highlight {
            color: #ffffff;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="ranking-container">
    <div class="ranking-header">
        <div class="ranking-title">{{title_text}}</div>
        <div class="header-cols">
            <div class="header-col-rank">排名</div>
            <div class="header-col-duration">群累计时长</div>
        </div>
    </div>
    <div class="ranking-list">
        {{items_html}}
    </div>
    <div class="card-footer">
        Create by <span class="footer-highlight">GsCore</span> &amp; Power by <span class="footer-highlight">SteamUID</span> &amp; Author by <span class="footer-highlight">sssysy</span>
    </div>
</div>
</body>
</html>
