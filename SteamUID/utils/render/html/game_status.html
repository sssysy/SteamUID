<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
        <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/game_status.css">
</head>
<body>
<div class="game-status-card">
    {{cover_html}}
    <div class="info-row">
        <div class="avatar-box">
            <div class="avatar-wrapper">
                {{avatar_frame_html}}
                <img class="avatar" src="{{avatar_url}}" onerror="this.onerror=null;this.src='{{default_avatar}}'" alt="">
            </div>
            <div class="status-bar"></div>
        </div>
        <div class="text-area">
            <div class="persona-row">
                <span class="persona-name">{{persona_name}}</span>
                {{group_name_html}}
            </div>
            <div class="subtitle">{{subtitle}}</div>
            <div class="game-name">{{game_name}}</div>
        </div>
    </div>
</div>
</body>
</html>
