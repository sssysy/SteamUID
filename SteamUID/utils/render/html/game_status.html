<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <style>
        @font-face {
            font-family: 'Motiva Sans';
            font-style: normal;
            font-weight: 400;
            src: url('https://community.cloudflare.steamstatic.com/public/shared/fonts/motiva-sans-regular.woff') format('woff');
        }
        @font-face {
            font-family: 'Motiva Sans';
            font-style: normal;
            font-weight: 500;
            src: url('https://community.cloudflare.steamstatic.com/public/shared/fonts/motiva-sans-medium.woff') format('woff');
        }
        @font-face {
            font-family: 'Motiva Sans';
            font-style: normal;
            font-weight: 700;
            src: url('https://community.cloudflare.steamstatic.com/public/shared/fonts/motiva-sans-bold.woff') format('woff');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        body {
            background: transparent;
            display: inline-block;
        }

        .game-status-card {
            position: relative;
            width: {{canvas_width}}px;
            overflow: hidden;
            background: #171a21;
            font-family: "Motiva Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", "Noto Sans CJK SC", "Noto Sans SC", sans-serif;
        }

        .game-status-card .cover-img {
            display: block;
            width: 100%;
            height: {{cover_height}}px;
            object-fit: cover;
            object-position: center top;
        }

        .game-status-card .info-row {
            display: flex;
            flex-direction: row;
            align-items: center;
            padding: 14px 18px;
            background: linear-gradient(135deg, #1e2430 0%, #171a21 60%, #13161c 100%);
            box-sizing: border-box;
        }

        .game-status-card .avatar-box {
            display: flex;
            flex-direction: row;
            flex-shrink: 0;
            position: relative;
            height: 56px;
        }

        .game-status-card .avatar-wrapper {
            position: relative;
            width: 56px;
            height: 56px;
            flex-shrink: 0;
            z-index: 2;
        }

        .game-status-card .avatar {
            width: 56px;
            height: 56px;
            object-fit: cover;
            display: block;
        }

        .game-status-card .avatar-frame {
            position: absolute;
            top: -9.4%;
            left: -9.4%;
            width: 118.8%;
            height: 118.8%;
            pointer-events: none;
            z-index: 2;
        }

        .game-status-card .avatar-frame img {
            width: 100%;
            height: 100%;
            display: block;
        }

        .game-status-card .status-bar {
            width: 4px;
            height: 56px;
            background-color: {{status_bar_color}};
            flex-shrink: 0;
            position: relative;
            z-index: 1;
            box-shadow: 0 0 4px 1px rgba(0, 0, 0, 0.75);
        }

        .game-status-card .text-area {
            flex: 1;
            min-width: 0;
            margin-left: 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .game-status-card .persona-row {
            display: flex;
            flex-direction: row;
            align-items: baseline;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.25;
            margin-bottom: 2px;
        }

        .game-status-card .persona-name {
            font-size: 16px;
            font-weight: 700;
            color: {{persona_color}};
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .game-status-card .group-name {
            font-size: 14px;
            font-weight: 500;
            color: {{group_color}};
            margin-left: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 1;
        }

        .game-status-card .subtitle {
            font-size: 13px;
            font-weight: 500;
            color: {{subtitle_color}};
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.25;
            margin-bottom: 2px;
        }

        .game-status-card .game-name {
            font-size: 13px;
            font-weight: 700;
            color: {{game_name_color}};
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.25;
        }
    </style>
</head>
<body>
<div class="game-status-card">
    {{cover_html}}
    <div class="info-row">
        <div class="avatar-box">
            <div class="avatar-wrapper">
                {{avatar_frame_html}}
                <img class="avatar" src="{{avatar_url}}" onerror="this.onerror=null;this.src='{{default_avatar}}'" alt="">
            </div>
            <div class="status-bar"></div>
        </div>
        <div class="text-area">
            <div class="persona-row">
                <span class="persona-name">{{persona_name}}</span>
                {{group_name_html}}
            </div>
            <div class="subtitle">{{subtitle}}</div>
            <div class="game-name">{{game_name}}</div>
        </div>
    </div>
</div>
</body>
</html>
