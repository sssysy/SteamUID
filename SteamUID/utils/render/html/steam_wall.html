<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <style>
        @font-face {
            font-family: 'Motiva Sans';
            font-style: normal;
            font-weight: 400;
            src: url('https://community.cloudflare.steamstatic.com/public/shared/fonts/motiva-sans-regular.woff') format('woff');
        }
        @font-face {
            font-family: 'Motiva Sans';
            font-style: normal;
            font-weight: 500;
            src: url('https://community.cloudflare.steamstatic.com/public/shared/fonts/motiva-sans-medium.woff') format('woff');
        }
        @font-face {
            font-family: 'Motiva Sans';
            font-style: normal;
            font-weight: 700;
            src: url('https://community.cloudflare.steamstatic.com/public/shared/fonts/motiva-sans-bold.woff') format('woff');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        body {
            background: transparent;
            display: inline-block;
        }

        .steam-wall-card {
            width: {{canvas_width}}px;
            background: linear-gradient(180deg, #1e2430 0%, #171a21 100%);
            padding: 0;
            font-family: "Motiva Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", "Noto Sans CJK SC", "Noto Sans SC", sans-serif;
            color: #ffffff;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        /* 顶部栏：左侧标题 + 右侧账号卡片 */
        .wall-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 24px 28px 20px 28px;
        }

        .wall-title {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.2px;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
        }

        /* 下方游戏墙网格容器：铺满卡片左右和下方（0间距），空余方格透明展示大卡片渐变背景 */
        .game-wall-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-auto-rows: calc({{canvas_width}}px / 8 * 215 / 460);
            grid-gap: 0;
            grid-auto-flow: dense;
            background-color: transparent;
            overflow: hidden;
            width: 100%;
            margin: 0;
            padding: 0;
        }

        .game {
            position: relative;
            overflow: hidden;
            background-color: transparent;
        }

        .game-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        /* 空状态 */
        .empty-state {
            margin: 0 28px 28px 28px;
            padding: 40px 0;
            text-align: center;
            color: #8f98a0;
            font-size: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }

        .card-footer {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 16px 28px 20px 28px;
            box-sizing: border-box;
            background: transparent;
        }

        .card-footer img {
            max-width: 560px;
            max-height: 20px;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <div class="steam-wall-card">
        <!-- 顶部栏：左侧标题 + 右上角用户卡片 -->
        <div class="wall-header">
            <div class="wall-title">steam游戏墙</div>
            {{account_pill_html}}
        </div>

        <!-- 游戏墙网格 -->
        {{grid_html}}

        <!-- Footer -->
        <div class="card-footer">
            <img src="{{footer_b64}}" alt="">
        </div>
    </div>
    <script>
        document.querySelectorAll('.game-img').forEach(function(img) {
            if (img.complete && img.naturalWidth === 0) {
                img.closest('.game')?.remove();
            }
            img.addEventListener('error', function() {
                img.closest('.game')?.remove();
            });
        });
    </script>
</body>
</html>
