<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
        <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/steam_wall.css">
</head>
<body>
    <div class="steam-wall-card">
        <!-- 顶部栏：左侧标题 + 右上角用户卡片 -->
        <div class="wall-header">
            <div class="wall-title">steam游戏墙</div>
            {{account_pill_html}}
        </div>

        <!-- 游戏墙网格 -->
        {{grid_html}}

        <!-- Footer -->
        <div class="card-footer">
            Create by <span class="footer-highlight">GsCore</span> &amp; Power by <span class="footer-highlight">SteamUID</span> &amp; Author by <span class="footer-highlight">sssysy</span>
        </div>
    </div>
    <script>
        document.querySelectorAll('.game-img').forEach(function(img) {
            if (img.complete && img.naturalWidth === 0) {
                img.closest('.game')?.remove();
            }
            img.addEventListener('error', function() {
                img.closest('.game')?.remove();
            });
        });
    </script>
</body>
</html>
