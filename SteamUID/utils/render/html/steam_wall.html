<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <style>
        @font-face {
            font-family: 'Motiva Sans';
            font-style: normal;
            font-weight: 400;
            src: url('https://community.cloudflare.steamstatic.com/public/shared/fonts/motiva-sans-regular.woff') format('woff');
        }
        @font-face {
            font-family: 'Motiva Sans';
            font-style: normal;
            font-weight: 500;
            src: url('https://community.cloudflare.steamstatic.com/public/shared/fonts/motiva-sans-medium.woff') format('woff');
        }
        @font-face {
            font-family: 'Motiva Sans';
            font-style: normal;
            font-weight: 700;
            src: url('https://community.cloudflare.steamstatic.com/public/shared/fonts/motiva-sans-bold.woff') format('woff');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        body {
            background: transparent;
            display: inline-block;
        }

        .steam-wall-card {
            width: {{canvas_width}}px;
            background: linear-gradient(180deg, #1e2430 0%, #171a21 100%);
            padding: 0;
            font-family: "Motiva Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", "Noto Sans CJK SC", "Noto Sans SC", sans-serif;
            color: #ffffff;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        /* 顶部栏：左侧标题 + 右侧账号卡片 */
        .wall-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 24px 28px 20px 28px;
        }

        .wall-title {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.2px;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
        }

        /* 右上角药丸型账号卡片（同 steam查看 单个用户卡片） */
        .pill-item {
            position: relative;
            width: 380px;
            height: 68px;
            border-radius: 9999px;
            overflow: hidden;
            display: flex;
            align-items: center;
            padding: 0 18px;
            box-sizing: border-box;
            border: none;
            background: linear-gradient(135deg, #2a475e 0%, #1e364a 50%, #1b2838 100%);
            flex-shrink: 0;
        }

        /* 背景图片（右半边渐隐过渡到默认底色） */
        .pill-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: right center;
            background-repeat: no-repeat;
            -webkit-mask-image: linear-gradient(to right, transparent 0%, transparent 25%, rgba(0, 0, 0, 0.35) 50%, rgba(0, 0, 0, 0.9) 80%);
            mask-image: linear-gradient(to right, transparent 0%, transparent 25%, rgba(0, 0, 0, 0.35) 50%, rgba(0, 0, 0, 0.9) 80%);
            z-index: 1;
        }

        /* 淡黑色蒙版 */
        .pill-mask {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(14, 18, 26, 0.5) 0%, rgba(14, 18, 26, 0.3) 60%, rgba(14, 18, 26, 0.2) 100%);
            z-index: 2;
        }

        /* 内容层 */
        .pill-content {
            position: relative;
            z-index: 3;
            display: flex;
            align-items: center;
            width: 100%;
        }

        /* Steam 头像与头像框 */
        .avatar-box {
            position: relative;
            width: 46px;
            height: 46px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .steam-avatar {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            border: none;
            box-sizing: border-box;
            background: #171a21;
        }

        .avatar-frame {
            position: absolute;
            top: -9.4%;
            left: -9.4%;
            width: 118.8%;
            height: 118.8%;
            pointer-events: none;
            z-index: 4;
        }

        .avatar-frame img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
        }

        /* Steam 资料信息 */
        .info-box {
            margin-left: 14px;
            min-width: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .steam-name {
            font-size: 15.5px;
            font-weight: 700;
            color: #66c0f4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3;
            text-shadow: 0 1px 6px rgba(102, 192, 244, 0.4), 0 1px 4px rgba(0, 0, 0, 0.85);
        }

        .steam-friend-code {
            font-size: 12.5px;
            font-weight: 500;
            color: #98a2ad;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        }

        /* 下方游戏墙网格容器：铺满卡片左右和下方（0间距），空余方格透明展示大卡片渐变背景 */
        .game-wall-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-auto-rows: calc({{canvas_width}}px / 8 * 215 / 460);
            grid-gap: 0;
            grid-auto-flow: dense;
            background-color: transparent;
            overflow: hidden;
            width: 100%;
            margin: 0;
            padding: 0;
        }

        .game {
            position: relative;
            overflow: hidden;
            background-color: transparent;
        }

        .game-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        /* 空状态 */
        .empty-state {
            margin: 0 28px 28px 28px;
            padding: 40px 0;
            text-align: center;
            color: #8f98a0;
            font-size: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="steam-wall-card">
        <!-- 顶部栏：左侧标题 + 右上角用户卡片 -->
        <div class="wall-header">
            <div class="wall-title">steam游戏墙</div>
            <div class="pill-item">
                {{bg_html}}
                <div class="pill-mask"></div>
                <div class="pill-content">
                    <div class="avatar-box">
                        <img class="steam-avatar" src="{{avatar_url}}" onerror="this.onerror=null;this.src='{{default_avatar}}'" alt="">
                        {{frame_html}}
                    </div>
                    <div class="info-box">
                        <div class="steam-name" title="{{user_name}}">{{user_name}}</div>
                        <div class="steam-friend-code">{{friend_code}}</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 游戏墙网格 -->
        {{grid_html}}
    </div>
    <script>
        document.querySelectorAll('.game-img').forEach(function(img) {
            if (img.complete && img.naturalWidth === 0) {
                img.closest('.game')?.remove();
            }
            img.addEventListener('error', function() {
                img.closest('.game')?.remove();
            });
        });
    </script>
</body>
</html>
