<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
        <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/bind_list.css">
</head>
<body>
    <div class="bind-card">
        <!-- 顶部用户信息栏 -->
        <div class="card-header">
            <div class="qq-avatar-box">
                <img class="qq-avatar" src="{{qq_avatar_url}}" onerror="this.onerror=null;this.src='{{default_avatar}}'" alt="">
            </div>
            <div class="header-info">
                <div class="header-title">Steam绑定列表</div>
                <div class="header-user-name">{{user_name}}</div>
            </div>
        </div>

        <!-- 图例栏 -->
        <div class="legend-bar">
            <div class="legend-item">
                <div class="legend-dot main-dot"></div>
                <div class="legend-text">本群默认账户</div>
            </div>
            <div class="legend-item">
                <div class="legend-dot login-dot"></div>
                <div class="legend-text">已登录</div>
            </div>
            <div class="legend-item">
                <div class="legend-dot bind-dot"></div>
                <div class="legend-text">仅绑定</div>
            </div>
        </div>

        <!-- 账号列表 -->
        <div class="account-list">
            {{items_html}}
        </div>

        <!-- Footer -->
        <div class="card-footer">
            Create by <span class="footer-highlight">GsCore</span> &amp; Power by <span class="footer-highlight">SteamUID</span> &amp; Author by <span class="footer-highlight">sssysy</span>
        </div>
    </div>
</body>
</html>
