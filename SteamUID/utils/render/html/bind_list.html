<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <style>
        @font-face {
            font-family: 'Motiva Sans';
            font-style: normal;
            font-weight: 400;
            src: url('https://community.cloudflare.steamstatic.com/public/shared/fonts/motiva-sans-regular.woff') format('woff');
        }
        @font-face {
            font-family: 'Motiva Sans';
            font-style: normal;
            font-weight: 500;
            src: url('https://community.cloudflare.steamstatic.com/public/shared/fonts/motiva-sans-medium.woff') format('woff');
        }
        @font-face {
            font-family: 'Motiva Sans';
            font-style: normal;
            font-weight: 700;
            src: url('https://community.cloudflare.steamstatic.com/public/shared/fonts/motiva-sans-bold.woff') format('woff');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        body {
            background: transparent;
            display: inline-block;
        }

        .bind-card {
            width: {{canvas_width}}px;
            background: linear-gradient(180deg, #1e2430 0%, #171a21 100%);
            padding: 20px 24px 24px 24px;
            font-family: "Motiva Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", "Noto Sans CJK SC", "Noto Sans SC", sans-serif;
            color: #ffffff;
            border-radius: 0;
            border: none;
            position: relative;
            overflow: hidden;
        }

        /* 顶部用户栏 */
        .card-header {
            display: flex;
            align-items: center;
            padding-bottom: 2px;
            border-bottom: none;
        }

        .qq-avatar-box {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            background: #11141a;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qq-avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .header-info {
            margin-left: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
            flex: 1;
        }

        .header-title {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.3px;
            line-height: 1.3;
        }

        .header-user-name {
            font-size: 13.5px;
            font-weight: 400;
            color: #8f98a0;
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3;
        }

        /* 图例栏 */
        .legend-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 6px;
            margin-bottom: 10px;
            padding-left: 0;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .legend-dot.main-dot {
            background-color: #66c0f4;
            box-shadow: 0 0 6px rgba(102, 192, 244, 0.6);
        }

        .legend-dot.asf-dot {
            background-color: #f0b232;
            box-shadow: 0 0 6px rgba(240, 178, 50, 0.6);
        }

        .legend-text {
            font-size: 12.5px;
            font-weight: 500;
            color: #8f98a0;
            letter-spacing: 0.2px;
        }

        /* 账号列表容器 */
        .account-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 药丸型账号卡片 */
        .pill-item {
            position: relative;
            height: 74px;
            border-radius: 9999px;
            overflow: hidden;
            display: flex;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
            border: none;
            background: linear-gradient(135deg, #2a475e 0%, #1e364a 50%, #1b2838 100%);
        }

        .pill-item.is-main {
            border: none;
        }

        /* 背景图片（右半边渐隐过渡到默认底色，清晰无模糊） */
        .pill-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: right center;
            background-repeat: no-repeat;
            -webkit-mask-image: linear-gradient(to right, transparent 0%, transparent 25%, rgba(0, 0, 0, 0.35) 50%, rgba(0, 0, 0, 0.9) 80%);
            mask-image: linear-gradient(to right, transparent 0%, transparent 25%, rgba(0, 0, 0, 0.35) 50%, rgba(0, 0, 0, 0.9) 80%);
            z-index: 1;
        }

        /* 淡黑色蒙版 */
        .pill-mask {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(14, 18, 26, 0.5) 0%, rgba(14, 18, 26, 0.3) 60%, rgba(14, 18, 26, 0.2) 100%);
            z-index: 2;
        }

        /* 内容层 */
        .pill-content {
            position: relative;
            z-index: 3;
            display: flex;
            align-items: center;
            width: 100%;
        }

        /* Steam 头像与头像框 */
        .avatar-box {
            position: relative;
            width: 50px;
            height: 50px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .steam-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            border: none;
            box-sizing: border-box;
            background: #171a21;
        }

        .pill-item.is-main .steam-avatar {
            border: none;
            box-shadow: none;
        }

        .avatar-frame {
            position: absolute;
            top: -9.4%;
            left: -9.4%;
            width: 118.8%;
            height: 118.8%;
            pointer-events: none;
            z-index: 4;
        }

        .avatar-frame img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
        }

        /* Steam 资料信息 */
        .info-box {
            margin-left: 18px;
            min-width: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .steam-name-row {
            display: flex;
            align-items: center;
            gap: 7px;
            min-width: 0;
        }

        .steam-name {
            font-size: 16.5px;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
        }

        .status-dots {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }

        .status-dot.main-dot {
            background-color: #66c0f4;
            box-shadow: 0 0 6px rgba(102, 192, 244, 0.8);
        }

        .status-dot.asf-dot {
            background-color: #f0b232;
            box-shadow: 0 0 6px rgba(240, 178, 50, 0.8);
        }

        .steam-friend-code {
            font-size: 13px;
            font-weight: 500;
            color: #98a2ad;
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        }

        /* 空状态 */
        .empty-state {
            padding: 28px 0;
            text-align: center;
            color: #8f98a0;
            font-size: 14.5px;
        }

        .card-footer {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            width: 100%;
            margin-top: 18px;
            box-sizing: border-box;
            position: relative;
            z-index: 3;
            font-size: 11px;
            color: #8f98a0;
            font-weight: 400;
            letter-spacing: 0.3px;
            user-select: none;
        }

        .card-footer .footer-highlight {
            color: #ffffff;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="bind-card">
        <!-- 顶部用户信息栏 -->
        <div class="card-header">
            <div class="qq-avatar-box">
                <img class="qq-avatar" src="{{qq_avatar_url}}" onerror="this.onerror=null;this.src='{{default_avatar}}'" alt="">
            </div>
            <div class="header-info">
                <div class="header-title">Steam绑定列表</div>
                <div class="header-user-name">{{user_name}}</div>
            </div>
        </div>

        <!-- 图例栏 -->
        <div class="legend-bar">
            <div class="legend-item">
                <div class="legend-dot main-dot"></div>
                <div class="legend-text">本群默认账户</div>
            </div>
            <div class="legend-item">
                <div class="legend-dot asf-dot"></div>
                <div class="legend-text">ASF 在线</div>
            </div>
        </div>

        <!-- 账号列表 -->
        <div class="account-list">
            {{items_html}}
        </div>

        <!-- Footer -->
        <div class="card-footer">
            Create by <span class="footer-highlight">GsCore</span> &amp; Power by <span class="footer-highlight">SteamUID</span> &amp; Author by <span class="footer-highlight">sssysy</span>
        </div>
    </div>
</body>
</html>
