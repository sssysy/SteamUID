<!DOCTYPE html>
<html lang="zh-cn">
<head>
<meta charset="UTF-8">
<style>
{{ styles }}
body {
  font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", "WenQuanYi Zen Hei", sans-serif;
}
/* 容器宽度由 Python 侧常量注入 */
.announce-container {
  width: {{ canvas_width }}px;
}
</style>
</head>
<body>
<div class="announce-container" id="steam-announce-push-card">
  <div class="announce-header">
    <div class="announce-header-top">
      <div class="announce-title-col">
        <div class="announce-tag">{{ event_tag }}</div>
        <div class="announce-title">{{ announce_title }}</div>
      </div>
      <div class="game-badge">
        <img class="game-logo" src="{{ game_logo_url }}" alt="">
        <div class="game-name" title="{{ game_name }}">{{ game_name }}</div>
      </div>
    </div>
  </div>
  <div class="announce-content">{{ content_html }}</div>
  {{ footer_html }}
</div>
</body>
</html>
