<!DOCTYPE html>
<html lang="zh-cn">
<head>
<meta charset="UTF-8">
<style>
@font-face {
  font-family: 'SteamFont';
  src: url('{{ font_regular_url }}') format('truetype');
  font-weight: 400;
  font-style: normal;
}
@font-face {
  font-family: 'SteamFont';
  src: url('{{ font_medium_url }}') format('truetype');
  font-weight: 500;
  font-style: normal;
}
@font-face {
  font-family: 'SteamFont';
  src: url('{{ font_bold_url }}') format('truetype');
  font-weight: 700;
  font-style: normal;
}
{{ styles }}
body {
  font-family: 'SteamFont', "Motiva Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
/* 画布宽度由 Python 侧按成就条数注入，避免与 css 写死值漂移 */
.steam-achievement-card {
  width: {{ canvas_width }}px;
}
</style>
</head>
<body>
<div class="steam-achievement-card" id="steam-achievement-card">
  <div class="achievement-header">
    <div class="header-bg" style="background-image: url('{{ cover_url }}');"></div>
    <div class="header-overlay"></div>
    <div class="header-content">
      <div class="header-top-row">
        <div class="game-info">
          <img class="game-icon" src="{{ game_icon_url }}" onerror="this.onerror=null;this.src='{{ default_icon }}'" alt="">
          <div class="game-title" title="{{ game_name }}">{{ game_name }}</div>
        </div>
        {{ account_pill_html }}
      </div>

      <div class="progress-section">
        <div class="progress-meta">
          <span class="progress-left">已获得 {{ unlocked_count }} 项成就，共 {{ total_count }} 项</span>
          <span class="progress-right">({{ percentage }}%)</span>
        </div>
        <div class="progress-bar-container">
          <div class="progress-bar-fill" style="width: {{ percentage }}%;"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="achievements-body">
    {{ columns_html }}
  </div>

  {{ footer_html }}
</div>
</body>
</html>
