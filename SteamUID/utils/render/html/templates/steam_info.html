<!DOCTYPE html>
<html lang="zh-cn">
<head>
<meta charset="UTF-8">
<style>
@font-face {
  font-family: 'SteamFont';
  src: url('{{ font_regular_url }}') format('truetype');
  font-weight: 400;
  font-style: normal;
}
@font-face {
  font-family: 'SteamFont';
  src: url('{{ font_medium_url }}') format('truetype');
  font-weight: 500;
  font-style: normal;
}
@font-face {
  font-family: 'SteamFont';
  src: url('{{ font_bold_url }}') format('truetype');
  font-weight: 700;
  font-style: normal;
}
{{ styles }}
body {
  font-family: 'SteamFont', "Motiva Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
/* 容器宽度由 Python 侧常量注入；优先玩家迷你资料背景，缺失时用插件自带底图 */
.steam-info-card {
  width: {{ canvas_width }}px;
  background-image: linear-gradient(180deg, rgba(10, 14, 20, 0.38) 0%, rgba(9, 11, 16, 0.72) 58%, rgba(8, 10, 14, 0.94) 100%){% if bg_url %}, url('{{ bg_url }}'){% elif card_bg_url %}, url('{{ card_bg_url }}'){% endif %};
}
</style>
</head>
<body>
<div class="steam-info-card" id="steam-info-card">
  {{ header_html }}

  {{ stats_html }}

  {{ id_html }}

  {{ footer_html }}
</div>
</body>
</html>
