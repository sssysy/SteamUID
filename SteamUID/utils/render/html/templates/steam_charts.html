<!DOCTYPE html>
<html lang="zh-cn">
<head>
<meta charset="UTF-8">
<style>
{{ styles }}
body {
  font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", "WenQuanYi Zen Hei", sans-serif;
}
/* 容器宽度由 Python 侧常量注入；背景与「查看」卡片同款：压暗渐变 + 底图 */
.charts-card {
  width: {{ canvas_width }}px;
  background-image: linear-gradient(180deg, rgba(13, 17, 24, 0.35) 0%, rgba(9, 11, 16, 0.72) 100%){% if bg_url %}, url('{{ bg_url }}'){% endif %};
}
</style>
</head>
<body>
<div class="charts-card" id="steam-charts-card">
  <div class="charts-header">
    <div class="charts-title">{{ title }}</div>
    <div class="charts-subtitle">{{ subtitle }}</div>
  </div>

  <div class="charts-grid">{{ cells_html }}</div>

  {{ footer_html }}
</div>
</body>
</html>
