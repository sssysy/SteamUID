<!DOCTYPE html>
<html lang="zh-cn">
<head>
<meta charset="UTF-8">
<style>
{{ styles }}
body {
  font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", "WenQuanYi Zen Hei", sans-serif;
}
/* 画布宽度与网格行高由 Python 侧常量注入，避免与 css 写死值漂移 */
.steam-wall-card {
  width: {{ canvas_width }}px;
}
.game-wall-grid {
  grid-auto-rows: calc({{ canvas_width }}px / 8 * 215 / 460);
}
</style>
</head>
<body>
<div class="steam-wall-card" id="steam-wall-card">
  <div class="wall-header">
    <div class="wall-title">{{ title }}</div>
    {{ account_pill_html }}
  </div>

  {{ grid_html }}

  {{ note_html }}
  {{ footer_html }}
</div>
</body>
</html>
