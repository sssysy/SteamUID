<!DOCTYPE html>
<html lang="zh-cn">
<head>
<meta charset="UTF-8">
<style>
{{ styles }}
body {
  font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", "WenQuanYi Zen Hei", sans-serif;
}
/* 容器宽度由 Python 侧常量注入；背景与「查看」卡片同款：压暗渐变 + 底图 */
.ranking-card {
  width: {{ canvas_width }}px;
  background-image: linear-gradient(180deg, rgba(13, 17, 24, 0.35) 0%, rgba(9, 11, 16, 0.72) 100%){% if bg_url %}, url('{{ bg_url }}'){% endif %};
}
</style>
</head>
<body>
<div class="ranking-card" id="steam-ranking-card">
  <div class="ranking-header">
    <div class="ranking-header-top">
      <div class="ranking-title">{{ title }}</div>
      {{ badge_html }}
    </div>
    <div class="ranking-cols">
      <div class="col-rank">排名</div>
      <div class="col-duration">群累计时长</div>
    </div>
  </div>

  <div class="ranking-list">{{ items_html }}</div>

  {{ footer_html }}
</div>
</body>
</html>
