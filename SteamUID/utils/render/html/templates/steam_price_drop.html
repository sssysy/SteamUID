<!DOCTYPE html>
<html lang="zh-cn">
<head>
<meta charset="UTF-8">
<style>
{{ styles }}
body {
  font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", "WenQuanYi Zen Hei", sans-serif;
}
/* 容器宽度由 Python 侧常量注入；压暗渐变垫底，左半幅由封面铺满 */
.price-drop-card {
  width: {{ canvas_width }}px;
  background-image: linear-gradient(180deg, rgba(13, 17, 24, 0.35) 0%, rgba(9, 11, 16, 0.72) 100%){% if bg_url %}, url('{{ bg_url }}'){% endif %};
}
</style>
</head>
<body>
<div class="price-drop-card" id="steam-price-drop-card">
  {% if cover_url %}<div class="cover-bg" style="background-image: url('{{ cover_url }}');"></div>{% endif %}
  <div class="cover-mask"></div>
  <div class="card-main">
    <div class="left-spacer"></div>
    <div class="right-content">
      <div class="game-title" title="{{ title }}">{{ title }}</div>
      <div class="game-desc">{{ desc_html }}</div>
      <div class="price-row">{{ price_html }}</div>
    </div>
  </div>
  {{ footer_html }}
</div>
</body>
</html>
